<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Architecture diagram: a controller question enters a router that splits into a fast typed-plan lane, a tool-calling fallback lane, and a labelled judgement lane. The first two reach a single deterministic kernel, whose evidence ledger gates the narrating model.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      <g font-family="Archivo, sans-serif" font-size="12.5">

        <rect x="8" y="140" width="132" height="52" rx="3" fill="#e9edf1" stroke="#b6c1cb"/>
        <text x="74" y="162" text-anchor="middle" fill="#131920" font-weight="600">Controller asks</text>
        <text x="74" y="179" text-anchor="middle" fill="#71818f" font-size="11">plain language</text>

        <rect x="176" y="132" width="112" height="68" rx="3" fill="#f4e6f2" stroke="#8a3a80"/>
        <text x="232" y="156" text-anchor="middle" fill="#8a3a80" font-weight="600">Router</text>
        <text x="232" y="173" text-anchor="middle" fill="#71818f" font-size="10.5">confidence</text>
        <text x="232" y="187" text-anchor="middle" fill="#71818f" font-size="10.5">gate</text>

        <rect x="330" y="42" width="214" height="76" rx="3" fill="#e0eef3" stroke="#0f627d"/>
        <text x="344" y="66" fill="#0f627d" font-weight="600" font-size="11">LANE A · FAST PATH</text>
        <text x="344" y="86" fill="#131920" font-size="12.5">Typed plan IR → schema validate</text>
        <text x="344" y="104" fill="#71818f" font-size="11">the model emits a plan, never an answer</text>

        <rect x="330" y="132" width="214" height="76" rx="3" fill="#e9edf1" stroke="#b6c1cb"/>
        <text x="344" y="156" fill="#4a5865" font-weight="600" font-size="11">LANE B · FALLBACK</text>
        <text x="344" y="176" fill="#131920" font-size="12.5">Kernel exposed as typed tools</text>
        <text x="344" y="194" fill="#71818f" font-size="11">agent loop, unanticipated phrasings</text>

        <rect x="330" y="222" width="214" height="76" rx="3" fill="#f7edda" stroke="#8f5d09"/>
        <text x="344" y="246" fill="#8f5d09" font-weight="600" font-size="11">LANE C · JUDGEMENT</text>
        <text x="344" y="266" fill="#131920" font-size="12.5">Advisory, labelled as such</text>
        <text x="344" y="284" fill="#71818f" font-size="11">cites facts, asserts no new number</text>

        <rect x="586" y="88" width="150" height="120" rx="3" fill="#ffffff" stroke="#131920" stroke-width="1.5"/>
        <text x="661" y="118" text-anchor="middle" fill="#131920" font-weight="700" font-size="14">KERNEL</text>
        <text x="661" y="139" text-anchor="middle" fill="#71818f" font-size="10.5">7 rules · exact</text>
        <text x="661" y="155" text-anchor="middle" fill="#71818f" font-size="10.5">arithmetic</text>
        <text x="661" y="177" text-anchor="middle" fill="#0f627d" font-family="IBM Plex Mono, monospace" font-size="11">1.37 ms</text>
        <text x="661" y="193" text-anchor="middle" fill="#71818f" font-size="10.5">no model inside</text>

        <rect x="586" y="228" width="150" height="70" rx="3" fill="#e2f0e8" stroke="#2a6b46"/>
        <text x="661" y="252" text-anchor="middle" fill="#2a6b46" font-weight="600" font-size="11.5">EVIDENCE LEDGER</text>
        <text x="661" y="270" text-anchor="middle" fill="#71818f" font-size="10.5">every number it touched,</text>
        <text x="661" y="284" text-anchor="middle" fill="#71818f" font-size="10.5">including intermediates</text>

        <rect x="778" y="128" width="114" height="80" rx="3" fill="#e0eef3" stroke="#0f627d"/>
        <text x="835" y="154" text-anchor="middle" fill="#0f627d" font-weight="600" font-size="11">NARRATOR</text>
        <text x="835" y="172" text-anchor="middle" fill="#131920" font-size="11.5">writes the</text>
        <text x="835" y="188" text-anchor="middle" fill="#131920" font-size="11.5">sentence only</text>

        <g stroke="#b6c1cb" stroke-width="1.4" fill="none" marker-end="url(#ar)" color="#b6c1cb">
          <path d="M140,166 L172,166"/>
          <path d="M288,152 L326,88"/>
          <path d="M288,166 L326,168"/>
          <path d="M288,182 L326,250"/>
          <path d="M544,88 L582,130"/>
          <path d="M544,168 L582,158"/>
          <path d="M544,252 L582,258"/>
          <path d="M736,148 L774,158"/>
        </g>
        <path d="M661,208 L661,224" stroke="#2a6b46" stroke-width="1.4" fill="none" marker-end="url(#ar)" color="#2a6b46"/>
        <path d="M736,262 C768,262 778,222 778,202" stroke="#2a6b46" stroke-width="1.4" fill="none" marker-end="url(#ar)" color="#2a6b46"/>
        <text x="812" y="238" text-anchor="middle" fill="#2a6b46" font-size="10" font-family="IBM Plex Mono, monospace">gate</text>
      </g>
    </svg>
